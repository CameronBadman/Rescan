name: publish release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-publish
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      ECR_API: ${{ vars.ECR_API }}
      ECR_WORKER: ${{ vars.ECR_WORKER }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: mvn -B verify
      - run: python -m unittest discover -s worker/python -p 'test_*.py'
      - name: Build staging and run integration checks
        run: |
          docker build --target api-lambda -t "$ECR_API:$RELEASE_ID" .
          docker build --target worker -t "$ECR_WORKER:$RELEASE_ID" .
          docker run --rm --network none --cpus 1 --memory 4g --entrypoint /app/venv/bin/python -v "$GITHUB_WORKSPACE/scripts/benchmark_ocr.py:/app/benchmark_ocr.py:ro" "$ECR_WORKER:$RELEASE_ID" /app/benchmark_ocr.py > /tmp/ocr-benchmark.json
          docker compose build controller dev-auth
          export RESCAN_API_IMAGE="$ECR_API:$RELEASE_ID" RESCAN_WORKER_IMAGE="$ECR_WORKER:$RELEASE_ID"
          docker compose up -d --no-build
          timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health; do sleep 3; done'
          python scripts/smoke.py --timeout 600 --delete
          CONTAINER=$(docker create rescan-controller:local)
          docker cp "$CONTAINER:/app/controller.jar" controller/target/controller-0.1.0-SNAPSHOT.jar
          docker rm "$CONTAINER"
      - name: Stage cleanup
        if: always()
        run: docker compose down -v
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable images and release manifest
        run: |
          docker push "$ECR_API:$RELEASE_ID"
          docker push "$ECR_WORKER:$RELEASE_ID"
          API_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$ECR_API:$RELEASE_ID" | cut -d '@' -f2)
          WORKER_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$ECR_WORKER:$RELEASE_ID" | cut -d '@' -f2)
          JAR_SHA=$(sha256sum controller/target/controller-0.1.0-SNAPSHOT.jar | cut -d ' ' -f1)
          jq -n --arg commit "$GITHUB_SHA" --arg release "$RELEASE_ID" --arg api "$ECR_API@$API_DIGEST" --arg worker "$ECR_WORKER@$WORKER_DIGEST" --arg jar "$JAR_SHA" '{commit:$commit,release:$release,api_image:$api,worker_image:$worker,controller_sha256:$jar}' > /tmp/release.json
          aws s3 cp controller/target/controller-0.1.0-SNAPSHOT.jar "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID/controller.jar" --sse AES256
          aws s3 cp /tmp/release.json "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID/manifest.json" --sse AES256
          aws s3 cp /tmp/ocr-benchmark.json "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID/ocr-benchmark.json" --sse AES256
          echo "Release: $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
