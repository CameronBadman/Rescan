name: publish release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-publish
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      ECR_API: ${{ vars.ECR_API }}
      ECR_WORKER: ${{ vars.ECR_WORKER }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: mvn -B verify
      - run: python -m unittest discover -s worker/python -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - name: Build staging and run integration checks
        run: |
          docker compose build
          docker compose up -d
          timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health; do sleep 3; done'
          python scripts/smoke.py --timeout 600 --delete
      - name: Stage cleanup
        if: always()
        run: docker compose down -v
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable images and release manifest
        run: |
          docker buildx build --platform linux/amd64 --target api-lambda --provenance=false --push -t "$ECR_API:$RELEASE_ID" --metadata-file /tmp/api-image.json .
          docker buildx build --platform linux/amd64 --target worker --provenance=false --push -t "$ECR_WORKER:$RELEASE_ID" --metadata-file /tmp/worker-image.json .
          API_DIGEST=$(jq -r '."containerimage.digest"' /tmp/api-image.json)
          WORKER_DIGEST=$(jq -r '."containerimage.digest"' /tmp/worker-image.json)
          JAR_SHA=$(sha256sum controller/target/controller-0.1.0-SNAPSHOT.jar | cut -d ' ' -f1)
          jq -n --arg commit "$GITHUB_SHA" --arg release "$RELEASE_ID" --arg api "$ECR_API@$API_DIGEST" --arg worker "$ECR_WORKER@$WORKER_DIGEST" --arg jar "$JAR_SHA" '{commit:$commit,release:$release,api_image:$api,worker_image:$worker,controller_sha256:$jar}' > /tmp/release.json
          aws s3 cp controller/target/controller-0.1.0-SNAPSHOT.jar "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID/controller.jar" --sse AES256
          aws s3 cp /tmp/release.json "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID/manifest.json" --sse AES256
          echo "Release: $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
