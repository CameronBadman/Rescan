services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: rescan
      POSTGRES_USER: rescan
      POSTGRES_PASSWORD: local-rescan
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescan"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.2.10
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
  s3:
    image: localstack/localstack:4.6.0
    environment:
      SERVICES: s3
    ports: ["127.0.0.1:4566:4566"]
volumes:
  postgres-data:
  redis-data:
